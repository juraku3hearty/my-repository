<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden;
    font-family:'IPAGothic','IPAPGothic',sans-serif; }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 32%, rgba(6,199,85,0.22), rgba(6,199,85,0) 46%),
      linear-gradient(165deg, #123a2c 0%, #0c1f1a 55%, #0a1412 100%); }
  /* soft glow behind phone */
  .glow { position:absolute; left:50%; top:33%; width:760px; height:760px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.16), rgba(255,255,255,0) 62%); }
  .phone { position:absolute; left:50%; top:300px; transform:translateX(-50%);
    width:560px; height:1150px; background:#0b0b0d; border-radius:70px;
    padding:20px; box-shadow:0 40px 90px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.06) inset; }
  .screen { width:100%; height:100%; border-radius:52px; overflow:hidden; background:#fff; }
  .screen img { width:100%; height:100%; object-fit:cover; display:block; }
  .notch { position:absolute; left:50%; top:40px; transform:translateX(-50%);
    width:150px; height:34px; background:#0b0b0d; border-radius:20px; z-index:2; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen"><img src="file://__LINE_PNG__"></div>
  </div>
</body>
</html>
